<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17362b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <title>現場查驗表單 PoC</title>
  <style>
    :root {
      --ink:#17231e; --paper:#eee9dc; --card:#fffdf8; --line:#d5cfbf;
      --brand:#17362b; --brand2:#315f4d; --soft:#e5eee9; --bad:#9b3b2a;
      --bad-soft:#f7e5df; --warn:#8a6819; --warn-soft:#f6edd1; --muted:#746f63;
      --shadow:0 8px 24px rgba(23,54,43,.09);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif;line-height:1.5}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    .topbar{position:sticky;top:0;z-index:40;background:var(--brand);color:white;padding:max(10px,env(safe-area-inset-top)) 14px 10px;box-shadow:0 2px 12px rgba(0,0,0,.16)}
    .topbar-row{max-width:900px;margin:auto;display:flex;align-items:center;gap:10px}
    .brand{font-weight:700;flex:1}.brand small{display:block;font-size:11px;color:#bfd1c8;font-weight:500}
    .icon-btn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:white;border-radius:8px;padding:8px 11px}
    .statusbar{position:sticky;top:65px;z-index:35;background:#fff;border-bottom:1px solid var(--line);padding:7px 14px;display:flex;gap:6px;overflow:auto;white-space:nowrap}
    .pill{display:inline-flex;align-items:center;padding:4px 9px;border:1px solid var(--line);border-radius:20px;font-size:11.5px;background:#f6f2e9;color:var(--muted)}
    .pill.ok{background:var(--soft);color:var(--brand2);border-color:#b6cdbf}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
    main{max-width:900px;margin:auto;padding:16px 14px 80px}
    .hero{background:linear-gradient(135deg,var(--brand),#254d3e);color:white;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
    .hero h1{font-size:22px;margin:0 0 6px}.hero p{margin:0;color:#d2e0d9;font-size:13px}
    .section-title{font-size:15px;margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between}
    .catalog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
    .catalog-card,.record-card,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 3px 12px rgba(40,37,30,.045)}
    .catalog-card{padding:15px;display:flex;flex-direction:column;gap:8px}.catalog-card h3{margin:0;font-size:15px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted)}
    .tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:10.5px;padding:2px 7px;border-radius:12px;background:var(--soft);color:var(--brand2)}
    .card-actions{display:flex;gap:8px;margin-top:auto}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:7px;padding:9px 12px}.btn.primary{background:var(--brand2);color:white;border-color:var(--brand2);font-weight:650}.btn.danger{color:var(--bad);border-color:#ddb9ad}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
    .record-list{display:flex;flex-direction:column;gap:8px}.record-card{padding:12px;display:flex;gap:12px;align-items:center}.record-main{flex:1;min-width:0}.record-title{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
    .empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px;background:rgba(255,255,255,.35)}
    .form-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}.form-head-main{flex:1}.form-head h1{font-size:19px;margin:0}.form-head p{font-size:12px;color:var(--muted);margin:3px 0 0}
    .progress{height:6px;background:#dcd5c7;border-radius:4px;overflow:hidden;margin:8px 0 4px}.progress>div{height:100%;width:0;background:var(--brand2);transition:width .2s}.progress-label{font-size:11.5px;color:var(--muted)}
    .card{padding:16px;margin-bottom:12px}.card h2{font-size:14.5px;margin:0 0 11px}.hint{font-size:11.5px;color:var(--muted);margin:-6px 0 10px}
    .field-grid{display:grid;grid-template-columns:1fr;gap:11px}.field-grid.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .field.full{grid-column:1/-1}.field label,.sub-field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}.required::after{content:" *";color:var(--bad)}
    .field input,.field select,.field textarea,.sub-field input,.sub-field textarea,.grid-row input,.grid-row select{width:100%;border:1px solid var(--line);border-radius:6px;background:white;padding:9px 10px;color:var(--ink);min-height:42px}
    textarea{resize:vertical;min-height:86px}.field input:focus,.field select:focus,.field textarea:focus,.sub-field input:focus{outline:2px solid #8db29f;outline-offset:-1px}
    .field input:disabled,.field select:disabled,.field textarea:disabled{background:#efede7;color:#827e74}
    .input-unit{display:flex;align-items:center;gap:7px}.input-unit input{flex:1}.unit{font-size:12px;color:var(--muted);white-space:nowrap}
    .radio-row{display:flex;gap:7px;flex-wrap:wrap}.radio-btn{flex:1;min-width:105px;border:1px solid var(--line);background:white;border-radius:7px;padding:9px;text-align:center}.radio-btn.active{background:var(--brand2);color:white;border-color:var(--brand2)}
    .group-head{font-size:12px;font-weight:700;color:var(--brand2);background:var(--soft);padding:6px 9px;border-radius:6px;margin:14px 0 8px}
    .check-row{border:1px solid var(--line);background:white;border-radius:8px;padding:11px;margin-bottom:8px}.check-row.fail{border-color:#dcb5a9;background:#fffaf8}.check-top{display:flex;align-items:flex-start;gap:10px}.check-title{flex:1;font-size:13.5px;font-weight:620}.standard{font-size:11.5px;color:var(--muted);margin-top:3px}.hold{display:inline-block;margin-left:5px;font-size:10px;padding:1px 5px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
    .tri{display:flex;gap:4px}.tri button{width:40px;height:40px;border:1px solid var(--line);border-radius:7px;background:white;font-size:17px}.tri button.pass.active{background:var(--soft);color:var(--brand2);border-color:var(--brand2)}.tri button.fail.active{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}.tri button.na.active{background:#eeeae0;color:#625e55;border-color:#999184}
    .check-detail{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.sub-field.full{grid-column:1/-1}.auto-note{font-size:10.5px;margin-top:4px}.auto-note.pass{color:var(--brand2)}.auto-note.fail{color:var(--bad)}
    .measurement-wrap{display:flex;flex-direction:column;gap:10px}.grid-row{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px}.grid-row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12px;font-weight:700}.grid-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid-field label{font-size:10.5px;color:var(--muted);display:block;margin-bottom:3px}
    .decision-row{border-bottom:1px solid #e6e0d4;padding:11px 0}.decision-row:last-child{border-bottom:none}.decision-label{font-size:13px;margin-bottom:7px}.decision-options{display:flex;gap:6px}.decision-options button{min-width:54px;border:1px solid var(--line);background:white;border-radius:6px;padding:7px}.decision-options button.active{background:var(--brand2);color:white;border-color:var(--brand2)}.explain{margin-top:7px}
    .defect-box{background:#fffaf7;border-color:#d8b9ae}.photo-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photo{position:relative}.photo img{width:96px;height:72px;object-fit:cover;border:1px solid var(--line);border-radius:6px}.photo button{position:absolute;right:2px;top:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:white}
    .sig-box{border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px;margin-bottom:8px}.sig-box.signed{border-color:#a9c3b3;background:#fbfefc}.sig-head{display:flex;align-items:center;justify-content:space-between}.sig-image{max-width:230px;width:100%;height:75px;object-fit:contain;border-bottom:1px solid var(--line);margin-top:8px}.sig-meta{font-size:10.5px;color:var(--muted);word-break:break-all}.verify.ok{color:var(--brand2)}.verify.bad{color:var(--bad);font-weight:700}
    .remarks{font-size:11.5px;color:var(--muted);padding-left:20px}.remarks li{margin:4px 0}
    .bottom-actions{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom));display:flex;gap:7px;justify-content:center;overflow:auto}.bottom-actions .btn{white-space:nowrap}
    dialog{border:0;border-radius:12px;max-width:560px;width:calc(100% - 28px);padding:0;box-shadow:0 22px 70px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(15,28,23,.62)}.modal-body{padding:16px}.modal-body h3{margin:0 0 10px;font-size:15px}.pad{border:1.5px dashed var(--line);border-radius:8px;background:#fff;touch-action:none}.pad canvas{display:block;width:100%;height:210px;touch-action:none}.modal-actions{display:flex;gap:8px;margin-top:11px}.modal-actions .btn{flex:1}
    .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:80;background:var(--ink);color:white;border-radius:22px;padding:10px 16px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1}
    @media(max-width:620px){.field-grid.grid-2,.check-detail,.grid-fields{grid-template-columns:1fr}.statusbar{top:65px}.form-head{flex-direction:column}.catalog-grid{grid-template-columns:1fr}}
    @media print{
      body{background:white;font-size:11px}.topbar,.statusbar,.bottom-actions,.icon-btn,.btn,.hero,.home-only,.progress{display:none!important}main{max-width:none;padding:0}.card{box-shadow:none;break-inside:avoid;border-color:#888;padding:10px}.field input,.field select,.field textarea,.sub-field input,.grid-row input,.grid-row select{border:0;border-bottom:1px solid #aaa;padding:3px;min-height:0;background:white!important;color:black!important}.tri button{display:none}.tri button.active{display:inline-block;border:0;width:auto;height:auto;padding:0;background:none!important;color:black!important}.sig-image{height:55px}.form-head h1{font-size:16px}.grid-row{break-inside:avoid}.no-print{display:none!important}
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <button id="backBtn" class="icon-btn hidden" aria-label="返回">←</button>
    <div class="brand">現場查驗表單 PoC<small>Schema 驅動 · 離線優先 · 作業性簽認</small></div>
    <button id="installBtn" class="icon-btn hidden">安裝</button>
  </div>
</header>
<div class="statusbar">
  <span id="networkPill" class="pill">檢查網路…</span>
  <span id="storagePill" class="pill">初始化資料庫…</span>
  <span id="recordPill" class="pill hidden"></span>
  <span id="pendingPill" class="pill">待上傳 0</span>
  <span id="savePill" class="pill hidden">已儲存</span>
</div>
<main>
  <section id="homeView">
    <div class="hero">
      <h1>第七章施工抽查表單</h1>
      <p>5 種代表表單已完成：標準 checklist、多階段連續壁、重複量測、是非矩陣、定量規則。所有填寫先存本機，無網路仍可作業。</p>
    </div>
    <div class="section-title"><strong>建立新紀錄</strong><span class="code">PoC catalog 1.0</span></div>
    <div id="catalog" class="catalog-grid"></div>
    <div class="section-title"><strong>本機歷史紀錄</strong><button id="exportSyncBtn" class="btn small">匯出待上傳包</button></div>
    <div class="card" style="margin:10px 0 14px;padding:12px;font-size:12px;color:var(--muted)">
      <strong style="color:var(--ink)">PoC 同步說明：</strong>
      「待上傳」表示資料已安全存於本機 IndexedDB，但尚未送到伺服器。本版沒有後端 API；「匯出待上傳包」只會產生 JSON 檔供人工移轉，不會把紀錄標成已同步。
    </div>
    <div id="records" class="record-list"></div>
  </section>
  <section id="formView" class="hidden">
    <div class="form-head">
      <div class="form-head-main">
        <h1 id="formTitle"></h1>
        <p id="formMeta"></p>
        <div class="progress"><div id="progressFill"></div></div>
        <div id="progressLabel" class="progress-label"></div>
      </div>
    </div>
    <div id="formRoot"></div>
  </section>
</main>
<nav id="bottomActions" class="bottom-actions hidden">
  <button id="exportBtn" class="btn">匯出 JSON</button>
  <button id="printBtn" class="btn">列印／存 PDF</button>
  <button id="revisionBtn" class="btn">建立新版本</button>
  <button id="deleteBtn" class="btn danger">刪除草稿</button>
</nav>
<dialog id="signatureDialog">
  <div class="modal-body">
    <h3 id="signatureTitle">簽認</h3>
    <div class="field"><label class="required">簽署人姓名</label><input id="signerName" autocomplete="name"></div>
    <div class="pad" style="margin-top:10px"><canvas id="signatureCanvas"></canvas></div>
    <div class="modal-actions">
      <button id="sigClear" class="btn">清除</button><button id="sigCancel" class="btn">取消</button><button id="sigConfirm" class="btn primary">確認簽認</button>
    </div>
  </div>
</dialog>
<div id="toast" class="toast"></div>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
